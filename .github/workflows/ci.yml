name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  js:
    name: Typecheck, test and build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npx bob build

      - name: Typecheck the example app
        run: npx tsc -p example --noEmit

      - name: Bundle the example app
        working-directory: example
        run: |
          npx react-native bundle --entry-file index.js --platform android \
            --dev false --bundle-output /tmp/bundle.android.js
          npx react-native bundle --entry-file index.js --platform ios \
            --dev false --bundle-output /tmp/bundle.ios.js

  android:
    name: Compile the Android sources
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm ci

      - name: Compile against React Native's Android classes
        run: ./scripts/check-android.sh

      - name: Build the example app
        working-directory: example/android
        run: ./gradlew :app:assembleDebug --no-daemon
        env:
          JAVA_TOOL_OPTIONS: -Xmx4g

  ios:
    name: Check the iOS sources
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check both architectures
        run: ./scripts/check-ios.sh
