name: Release

# Publishes to npm with Trusted Publishing (OIDC), so no npm token is stored
# in this repository. Register this workflow once at
# npmjs.com/package/react-native-blur-overlay/access:
#
#   Publisher:    GitHub Actions
#   Organization: lvlrSajjad
#   Repository:   react-native-blur-overlay
#   Workflow:     release.yml
#   Environment:  (leave empty)
#
# To cut a release: bump the version in package.json, commit, then
#   git tag v3.0.0 && git push origin v3.0.0

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest

    permissions:
      contents: read
      # Required for Trusted Publishing.
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Use an npm version that supports Trusted Publishing
        run: npm install -g npm@latest

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Check that the tag matches package.json
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VERSION=$(node -p "require('./package.json').version")
          if [ "$TAG" != "$VERSION" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $VERSION"
            exit 1
          fi

      # `npm publish` runs `prepare` (bob build) before packing.
      - name: Publish
        run: npm publish
